name: Windows source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run headless validation (VS2022 / v143)
        shell: powershell
        run: ./tools/validate-source.ps1 -PlatformToolset v143
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-records
          path: |
            build/validation/
            build/tests/report.json
            build/examples/minimal-plugin/Release/activation.log
  prototype-frontend-validation:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked prototype dependencies
        run: npm ci
      - name: Typecheck isolated manager prototype
        run: npm run typecheck
      - name: Test manager prototype bridge and state
        run: npm test
      - name: Build isolated manager prototype
        run: npm run build
