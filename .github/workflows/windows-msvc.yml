name: Windows source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen source (VS2022 / v143)
        shell: powershell
        run: ./tools/validate-source.ps1 -PlatformToolset v143
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-records
          path: |
            build/validation/
            build/tests/report.json
            build/examples/minimal-plugin/Release/activation.log
